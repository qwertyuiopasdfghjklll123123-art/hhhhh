<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap');
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:#000;padding:16px;font-family:'Tajawal',sans-serif;}
a{color:var(--green);text-decoration:none;}
:root{
  --app-bg:oklch(0.145 0.014 245);
  --panel:oklch(0.195 0.017 245);
  --panel-2:oklch(0.235 0.019 245);
  --panel-3:oklch(0.29 0.02 245);
  --border:oklch(1 0 0 / 9%);
  --border-2:oklch(1 0 0 / 15%);
  --text:oklch(0.97 0.006 245);
  --text-dim:oklch(0.72 0.02 245);
  --text-faint:oklch(0.5 0.02 245);
  --green:oklch(0.78 0.17 152);
  --green-strong:oklch(0.66 0.18 152);
  --green-soft:oklch(0.78 0.17 152 / 16%);
  --green-ink:oklch(0.2 0.05 152);
  --blue:oklch(0.72 0.13 238);
}
.screen{width:100%;height:100%;background:var(--app-bg);border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;direction:rtl;border:1px solid var(--border-2);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);color:var(--text);}
h1,h2{margin:0;font-family:'Cairo',sans-serif;}
p{margin:0;}
.btn-primary{background:linear-gradient(135deg,var(--green),var(--green-strong));color:var(--green-ink);font-weight:800;border:none;border-radius:15px;padding:16px;font-size:15px;box-shadow:0 10px 24px -10px oklch(0.7 0.18 152/55%);width:100%;text-align:center;display:block;font-family:'Tajawal',sans-serif;}
.btn-ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--border-2);border-radius:15px;padding:15px;font-weight:700;font-size:14px;width:100%;font-family:'Tajawal',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--panel-2);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;}
.glow{position:absolute;top:-100px;left:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,oklch(0.78 0.17 152/22%),transparent 70%);filter:blur(10px);pointer-events:none;}
.badge{width:76px;height:76px;border-radius:22px;background:var(--panel);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 16px 30px -14px rgba(0,0,0,.6);}
.badge svg{width:36px;height:36px;stroke:var(--green);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.phone-row{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border-2);border-radius:14px;overflow:hidden;}
.cc{padding:15px 14px;font-weight:700;font-size:14px;color:var(--text);border-left:1px solid var(--border-2);background:var(--panel-2);}
.phone-input{flex:1;padding:15px 14px;font-size:14.5px;color:var(--text-faint);text-align:right;}
.divider{display:flex;align-items:center;gap:12px;color:var(--text-faint);font-size:12px;}
.divider .line{flex:1;height:1px;background:var(--border-2);}
</style>
</helmet>

<div class="screen">
  <div class="glow"></div>
  <div style="position:relative;display:flex;flex-direction:column;height:100%;padding:22px 24px 28px;">

    <div class="iconbtn">
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <div style="text-align:center;margin-top:26px;">
      <div class="badge"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.8-3 8.2-7 9-4-.8-7-4.2-7-9V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg></div>
    </div>

    <h1 style="font-size:25px;font-weight:800;text-align:center;margin-top:22px;">تسجيل الدخول</h1>
    <p style="text-align:center;color:var(--text-dim);font-size:14px;line-height:1.8;margin-top:8px;">
      أدخل رقم جوالك وسنرسل لك رمز تحقق لإتمام الدخول
    </p>

    <div style="margin-top:28px;display:flex;flex-direction:column;gap:14px;">
      <div class="phone-row">
        <div class="cc">966+</div>
        <div class="phone-input">5x xxx xxxx</div>
      </div>
      <a class="btn-primary" href="#">متابعة</a>
    </div>

    <div class="divider" style="margin:22px 0;">
      <div class="line"></div><span>أو</span><div class="line"></div>
    </div>

    <a class="btn-ghost" href="#">
      <svg class="icon" style="width:17px;height:17px;" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 6.5 8 6.5 8-6.5"/></svg>
      المتابعة عبر البريد الإلكتروني
    </a>

    <div style="flex:1;"></div>

    <div style="display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text-faint);font-size:12.5px;">
      <svg class="icon" style="width:15px;height:15px;" viewBox="0 0 24 24"><path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="3" y="13" width="4.5" height="6" rx="1.5"/><rect x="16.5" y="13" width="4.5" height="6" rx="1.5"/><path d="M20 19v1a3 3 0 0 1-3 3h-3"/></svg>
      <span>تحتاج مساعدة؟ <span style="color:var(--green);font-weight:600;">تواصل معنا</span></span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
