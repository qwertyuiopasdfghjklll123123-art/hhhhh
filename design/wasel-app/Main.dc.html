<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap');
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:#000;padding:16px;font-family:'Tajawal',sans-serif;}
:root{
  --app-bg:oklch(0.145 0.014 245);
  --panel:oklch(0.195 0.017 245);
  --panel-2:oklch(0.235 0.019 245);
  --panel-3:oklch(0.29 0.02 245);
  --border:oklch(1 0 0 / 9%);
  --border-2:oklch(1 0 0 / 15%);
  --text:oklch(0.97 0.006 245);
  --text-dim:oklch(0.72 0.02 245);
  --text-faint:oklch(0.5 0.02 245);
  --green:oklch(0.78 0.17 152);
  --green-strong:oklch(0.66 0.18 152);
  --green-soft:oklch(0.78 0.17 152 / 16%);
  --green-ink:oklch(0.2 0.05 152);
  --red:oklch(0.68 0.19 21);
}
.screen{width:100%;height:100%;background:var(--app-bg);border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;direction:rtl;border:1px solid var(--border-2);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);color:var(--text);}
h1,h2,h3{margin:0;font-family:'Cairo',sans-serif;}
p{margin:0;}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cairo',sans-serif;font-weight:800;color:#fff;flex-shrink:0;}
.bottom-nav{position:absolute;bottom:0;left:0;right:0;height:82px;background:oklch(0.16 0.016 245/94%);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 6px 12px;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--text-faint);font-size:10.5px;font-weight:500;width:56px;}
.nav-item.active{color:var(--green);}
.nav-fab{width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,var(--green),var(--green-strong));display:flex;align-items:center;justify-content:center;margin-top:-34px;box-shadow:0 12px 26px -8px oklch(0.7 0.18 152/65%);border:5px solid var(--app-bg);}
.nav-fab .icon{stroke:var(--green-ink);width:23px;height:23px;stroke-width:2.4;}
.header{padding:24px 20px 2px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--panel-2);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;position:relative;}
.scroll{flex:1;overflow:hidden;padding:16px 20px 0;display:flex;flex-direction:column;gap:14px;}
.chip{background:var(--panel);border:1px solid var(--border-2);border-radius:11px;padding:8px 12px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);font-weight:600;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;}
.trend{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--green);margin-top:7px;}
.trend svg{width:12px;height:12px;stroke-width:2.6;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;}
</style>
</helmet>

<div class="screen">
  <div class="header">
    <div style="display:flex;align-items:center;gap:11px;">
      <div class="avatar" style="width:44px;height:44px;font-size:16px;background:linear-gradient(145deg,oklch(0.7 0.15 152),oklch(0.55 0.15 152));">أ</div>
      <div>
        <h3 style="font-size:15px;font-weight:700;">مرحباً، أحمد</h3>
        <p style="font-size:11.5px;color:var(--text-faint);margin-top:2px;">إليك نظرة عامة على أداء حسابك</p>
      </div>
    </div>
    <div class="iconbtn">
      <svg class="icon" style="width:18px;height:18px;" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
      <div style="position:absolute;top:8px;left:8px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--app-bg);"></div>
    </div>
  </div>

  <div class="scroll">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <h2 style="font-size:16px;font-weight:700;">نظرة عامة</h2>
      <div class="chip">
        <span>آخر 30 يوم</span>
        <svg class="icon" style="width:13px;height:13px;" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <p style="font-size:11.5px;color:var(--text-faint);font-weight:500;">الرسائل المرسلة</p>
        <h3 style="font-size:23px;font-weight:800;margin-top:7px;">45,231</h3>
        <div class="trend"><svg viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>+18%</div>
      </div>
      <div class="stat-card">
        <p style="font-size:11.5px;color:var(--text-faint);font-weight:500;">معدل القراءة</p>
        <h3 style="font-size:23px;font-weight:800;margin-top:7px;">68%</h3>
        <div class="trend"><svg viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>+8%</div>
      </div>
      <div class="stat-card">
        <p style="font-size:11.5px;color:var(--text-faint);font-weight:500;">العملاء المستهدَفون</p>
        <h3 style="font-size:23px;font-weight:800;margin-top:7px;">12,543</h3>
        <div class="trend"><svg viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>+15%</div>
      </div>
      <div class="stat-card">
        <p style="font-size:11.5px;color:var(--text-faint);font-weight:500;">الردود</p>
        <h3 style="font-size:23px;font-weight:800;margin-top:7px;">2,847</h3>
        <div class="trend"><svg viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>+12%</div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <h3 style="font-size:14.5px;font-weight:700;">أداء الحملات</h3>
        <span style="font-size:11px;color:var(--text-faint);font-weight:600;">آخر 7 أيام</span>
      </div>
      <svg viewBox="0 0 300 128" style="width:100%;height:118px;margin-top:8px;" preserveAspectRatio="none">
        <defs>
          <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="oklch(0.78 0.17 152)" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="oklch(0.78 0.17 152)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="M284,86 L246,64 L188,74 L130,34 L72,48 L14,20 L14,112 L284,112 Z" fill="url(#areaFill)"/>
        <path d="M284,86 L246,64 L188,74 L130,34 L72,48 L14,20" fill="none" stroke="oklch(0.78 0.17 152)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="284" cy="86" r="3.2" fill="var(--app-bg)" stroke="oklch(0.78 0.17 152)" stroke-width="2"/>
        <circle cx="246" cy="64" r="3.2" fill="var(--app-bg)" stroke="oklch(0.78 0.17 152)" stroke-width="2"/>
        <circle cx="188" cy="74" r="3.2" fill="var(--app-bg)" stroke="oklch(0.78 0.17 152)" stroke-width="2"/>
        <circle cx="130" cy="34" r="3.2" fill="var(--app-bg)" stroke="oklch(0.78 0.17 152)" stroke-width="2"/>
        <circle cx="72" cy="48" r="3.2" fill="var(--app-bg)" stroke="oklch(0.78 0.17 152)" stroke-width="2"/>
        <circle cx="14" cy="20" r="4.2" fill="oklch(0.78 0.17 152)" stroke="var(--app-bg)" stroke-width="2"/>
      </svg>
      <div style="display:flex;justify-content:space-between;margin-top:2px;">
        <span style="font-size:10.5px;color:var(--text-faint);">12 مايو</span>
        <span style="font-size:10.5px;color:var(--text-faint);">14 مايو</span>
        <span style="font-size:10.5px;color:var(--text-faint);">16 مايو</span>
        <span style="font-size:10.5px;color:var(--text-faint);">18 مايو</span>
      </div>
    </div>

    <div style="height:96px;flex-shrink:0;"></div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>الرئيسية</span>
    </div>
    <div class="nav-item">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20.5 3.5 3 10.8l6.2 2.3M20.5 3.5 13.7 21l-2.3-6.2M20.5 3.5 9.2 13.1"/></svg>
      <span>الحملات</span>
    </div>
    <div class="nav-fab"><svg class="icon" viewBox="0 0 24 24" stroke-width="2.4"><path d="M12 5v14"/><path d="M5 12h14"/></svg></div>
    <div class="nav-item">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.3 20a5.7 5.7 0 0 1 11.4 0"/><circle cx="17.5" cy="9.5" r="2.3"/><path d="M15 13.8a4.6 4.6 0 0 1 6 4.3"/></svg>
      <span>العملاء</span>
    </div>
    <div class="nav-item">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4.5 19.5V11"/><path d="M10.5 19.5V6"/><path d="M16.5 19.5v-8.5"/><path d="M2.5 19.5h19"/></svg>
      <span>التقارير</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
