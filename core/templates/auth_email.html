<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>__TITLE__ - __SITE_NAME__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4f0;--card:#ffffff;--card-border:rgba(34,26,18,.08);--primary:#2563eb;--primary-light:#3b82f6;--primary-glow:rgba(37,99,235,.14);--text:#221a12;--muted:#6b5d50;--border:#f0e6da;--danger:#ef4444;--input-bg:#fbf7f3}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:22px;box-shadow:0 8px 30px rgba(34,26,18,.08);padding:30px 24px;width:100%;max-width:380px}
.back{background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px;padding:0;display:inline-block;text-decoration:none}
h1{font-size:19px;font-weight:900;margin:4px 0 20px;letter-spacing:-.3px}
label{font-size:11.5px;color:var(--muted);font-weight:700;display:block;margin:14px 0 6px}
input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:13px;font-size:15px;background:var(--input-bg);outline:none;font-family:inherit;color:var(--text)}
input:focus{border-color:var(--primary)}
button.main{width:100%;margin-top:20px;padding:14px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px var(--primary-glow);transition:transform .15s}
button.main:disabled{opacity:.6;cursor:default;transform:none}
button.main:active{transform:scale(.98)}
.err{color:var(--danger);font-size:12.5px;text-align:center;min-height:18px;margin-top:12px;font-weight:600}
.switch{text-align:center;margin-top:18px;font-size:12.5px;color:var(--muted)}
.switch a{color:var(--primary);text-decoration:none;font-weight:700}
.note{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:12px;padding:11px 13px;font-size:12.5px;color:#0a8a63;font-weight:600;margin-bottom:8px}
</style>
</head>
<body>
<div class="card">
  <a class="back" href="/">‹ رجوع</a>
  <h1>__TITLE__</h1>
  __INSTALLED_NOTE__
  <form id="authForm">
    __NAME_FIELD__
    <label>البريد الإلكتروني</label>
    <input id="email" name="email" type="email" required autocomplete="email">
    <label>كلمة المرور</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" minlength="__MIN_PW__">
    <button class="main" id="btnSubmit" type="submit">__BUTTON_TEXT__</button>
    <div class="err" id="err"></div>
  </form>
  <p class="switch">__SWITCH_HTML__</p>
</div>
<script>
document.getElementById('authForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('btnSubmit');
  const err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  const fd = new FormData(this);
  try {
    const res = await fetch('__ACTION__', {method: 'POST', body: fd});
    const data = await res.json();
    if (data.ok) { window.location.href = '/app'; return; }
    err.textContent = data.error || 'حدث خطأ غير متوقع';
  } catch (e2) {
    err.textContent = 'تعذر الاتصال بالخادم';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
