<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>واصل — مُرسِل واتساب</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="">
  <div>
    <h1>واصل — مُرسِل واتساب</h1>
    <p id="siteLine">جارِ التحميل...</p>
  </div>
</header>

<section class="card" id="statusCard">
  <div class="row"><span>الحساب</span><b id="accName">—</b></div>
  <div class="row"><span>الاتصال بالموقع</span><b id="connState">—</b></div>
  <div class="row"><span>واتساب ويب</span><b id="waState">—</b></div>
  <div class="row"><span>أُرسلت اليوم من هذا الجهاز</span><b id="sentToday">0</b></div>
</section>

<div class="actions">
  <button id="openWa" class="primary">فتح واتساب ويب</button>
  <button id="pauseBtn">إيقاف مؤقت</button>
</div>

<details id="pairBox">
  <summary>ربط برمز من الموقع</summary>
  <p class="hint">من الموقع: حسابي ← "رمز الربط اليدوي" ← انسخ الرمز والصقه هنا.</p>
  <textarea id="pairCode" rows="3" dir="ltr" placeholder="WASEL1...."></textarea>
  <button id="pairBtn" class="primary">ربط</button>
  <p class="msg" id="pairMsg"></p>
</details>

<h2>آخر العمليات</h2>
<ul id="log"><li class="empty">ما فيه عمليات بعد</li></ul>

<footer>
  <span id="version"></span>
  <button id="testBtn" class="link">اختبار الاتصال</button>
</footer>
<script src="popup.js"></script>
</body>
</html>
