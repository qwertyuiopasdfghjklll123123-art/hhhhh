<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap');
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:#000;padding:16px;font-family:'Tajawal',sans-serif;}
a{color:var(--green);text-decoration:none;}
a:hover{color:var(--green-strong);}
:root{
  --app-bg:oklch(0.145 0.014 245);
  --panel:oklch(0.195 0.017 245);
  --panel-2:oklch(0.235 0.019 245);
  --panel-3:oklch(0.29 0.02 245);
  --border:oklch(1 0 0 / 9%);
  --border-2:oklch(1 0 0 / 15%);
  --text:oklch(0.97 0.006 245);
  --text-dim:oklch(0.72 0.02 245);
  --text-faint:oklch(0.5 0.02 245);
  --green:oklch(0.78 0.17 152);
  --green-strong:oklch(0.66 0.18 152);
  --green-soft:oklch(0.78 0.17 152 / 16%);
  --green-ink:oklch(0.2 0.05 152);
  --red:oklch(0.68 0.19 21);
  --red-soft:oklch(0.68 0.19 21 / 15%);
  --blue:oklch(0.72 0.13 238);
  --blue-soft:oklch(0.72 0.13 238 / 15%);
  --amber:oklch(0.8 0.14 78);
  --amber-soft:oklch(0.8 0.14 78 / 15%);
}
.screen{width:100%;height:100%;background:var(--app-bg);border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;direction:rtl;border:1px solid var(--border-2);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);color:var(--text);}
h1,h2,h3{margin:0;font-family:'Cairo',sans-serif;}
p{margin:0;}
.btn-primary{background:linear-gradient(135deg,var(--green),var(--green-strong));color:var(--green-ink);font-family:'Tajawal',sans-serif;font-weight:800;border:none;border-radius:15px;padding:16px;font-size:15px;box-shadow:0 10px 24px -10px oklch(0.7 0.18 152/55%);width:100%;text-align:center;display:block;}
.btn-ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--border-2);border-radius:15px;padding:15px;font-weight:700;font-size:14px;width:100%;text-align:center;font-family:'Tajawal',sans-serif;}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

.glow{position:absolute;top:-120px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,oklch(0.78 0.17 152/35%),transparent 70%);filter:blur(10px);pointer-events:none;}
.glow2{position:absolute;bottom:-140px;left:-100px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,oklch(0.72 0.13 238/18%),transparent 70%);filter:blur(10px);pointer-events:none;}

.logo-mark{width:84px;height:84px;border-radius:24px;background:linear-gradient(145deg,var(--green),var(--green-strong));display:flex;align-items:center;justify-content:center;box-shadow:0 16px 32px -10px oklch(0.7 0.18 152/60%);margin:0 auto;}
.logo-mark svg{width:42px;height:42px;stroke:var(--green-ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

.hero{position:relative;height:196px;margin:0 6px;}
.float-card{position:absolute;background:var(--panel);border:1px solid var(--border-2);border-radius:16px;padding:12px;box-shadow:0 20px 40px -16px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px;}
.float-card .chip{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.float-card .bar{height:6px;border-radius:4px;background:var(--panel-3);}
.fc1{width:150px;top:6px;right:14px;transform:rotate(-7deg);opacity:.55;}
.fc1 .bar{width:70%;}
.fc2{width:168px;top:44px;left:6px;transform:rotate(5deg);opacity:.8;}
.fc2 .bar{width:80%;}
.fc3{width:190px;top:88px;right:34px;transform:rotate(-2deg);z-index:2;}
.fc3 .chip{background:var(--green-soft);}
.fc3 .chip svg{stroke:var(--green);}
.fc3 .bar1{width:90%;}
.fc3 .bar2{width:55%;background:var(--green-soft);}

.feat{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;text-align:center;}
.feat .chip{width:44px;height:44px;border-radius:14px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.feat .chip svg{stroke:var(--green);}
.feat span{font-size:11px;color:var(--text-dim);font-weight:500;line-height:1.4;}
</style>
</helmet>

<div class="screen">
  <div class="glow"></div>
  <div class="glow2"></div>

  <div style="position:relative;flex:1;display:flex;flex-direction:column;padding:44px 24px 28px;">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M4 6.2A2.7 2.7 0 0 1 6.7 3.5h10.6A2.7 2.7 0 0 1 20 6.2v7.6a2.7 2.7 0 0 1-2.7 2.7H10l-4.6 3.8v-3.8h-.7A2.7 2.7 0 0 1 2 13.8"/><path d="M7 10h1.6l1.1 2.6 1.7-5.6 1.2 3h1.6" stroke="white"/></svg>
    </div>

    <div style="text-align:center;margin-top:18px;">
      <h1 style="font-size:38px;font-weight:900;letter-spacing:-.5px;">واصل</h1>
      <p style="font-size:12.5px;color:var(--text-faint);font-weight:500;letter-spacing:1.5px;margin-top:2px;">WASEL BUSINESS</p>
    </div>

    <p style="text-align:center;color:var(--text-dim);font-size:14.5px;line-height:1.8;max-width:280px;margin:16px auto 0;">
      منصّة احترافية لإدارة حملاتك التسويقية عبر واتساب للأعمال بسهولة وفعالية
    </p>

    <div class="hero">
      <div class="float-card fc1"><div class="bar" style="width:60%"></div><div class="bar" style="width:40%"></div></div>
      <div class="float-card fc2">
        <div class="row" style="display:flex;align-items:center;gap:8px;">
          <div class="chip" style="background:var(--blue-soft);"><svg class="icon" style="width:14px;height:14px;stroke:var(--blue);" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.3 20a5.7 5.7 0 0 1 11.4 0"/><circle cx="17.5" cy="9.5" r="2.3"/><path d="M15 13.8a4.6 4.6 0 0 1 6 4.3"/></svg></div>
          <div style="flex:1;"><div class="bar" style="width:100%"></div></div>
        </div>
        <div class="bar"></div>
      </div>
      <div class="float-card fc3">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="chip"><svg style="width:15px;height:15px;stroke:var(--green);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><path d="M20.5 3.5 3 10.8l6.2 2.3M20.5 3.5 13.7 21l-2.3-6.2M20.5 3.5 9.2 13.1"/></svg></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
            <div class="bar bar1"></div>
            <div class="bar bar2"></div>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:6px;">
      <div class="feat">
        <div class="chip"><svg class="icon" viewBox="0 0 24 24"><path d="M20.5 3.5 3 10.8l6.2 2.3M20.5 3.5 13.7 21l-2.3-6.2M20.5 3.5 9.2 13.1"/></svg></div>
        <span>حملات فعّالة</span>
      </div>
      <div class="feat">
        <div class="chip"><svg class="icon" viewBox="0 0 24 24"><path d="M4.5 19.5V11"/><path d="M10.5 19.5V6"/><path d="M16.5 19.5v-8.5"/><path d="M2.5 19.5h19"/></svg></div>
        <span>تحليلات دقيقة</span>
      </div>
      <div class="feat">
        <div class="chip"><svg class="icon" viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 9-12h-6l1-6Z"/></svg></div>
        <span>أتمتة كاملة</span>
      </div>
    </div>

    <div style="flex:1;min-height:20px;"></div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <a class="btn-primary" href="#">ابدأ الآن</a>
      <a class="btn-ghost" href="#" style="display:block;">تسجيل الدخول</a>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
