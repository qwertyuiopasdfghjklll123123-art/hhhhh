<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512" role="img" aria-label="FC">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#2a4778"/><stop offset="1" stop-color="#1f3157"/></linearGradient>
<clipPath id="clip"><rect width="1024" height="1024" rx="300"/></clipPath>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<style>
/* يتشكّل الشعار خلال 5 ثوانٍ ثم يبقى ثابتاً مع لمعة هادئة كل 9 ثوانٍ */
#bgr{transform-origin:512px 512px;transform-box:view-box;animation:bgIn .9s cubic-bezier(.2,.9,.3,1.2) both}
.f{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.4s cubic-bezier(.5,0,.2,1) .8s forwards}
.c{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.5s cubic-bezier(.5,0,.2,1) 2.0s forwards}
.l1{opacity:0;animation:slide .7s cubic-bezier(.2,.9,.3,1) 3.5s forwards}
.l2{opacity:0;animation:slide .7s cubic-bezier(.2,.9,.3,1) 3.75s forwards}
#shine{transform:translateX(-700px) skewX(-18deg);animation:shine 9s ease-in-out 4.3s infinite}
@keyframes bgIn{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes slide{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes shine{0%{transform:translateX(-700px) skewX(-18deg)}10%,100%{transform:translateX(1500px) skewX(-18deg)}}
@media (prefers-reduced-motion:reduce){#bgr,.f,.c,.l1,.l2{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}#shine{display:none}}
</style>
</defs>
<g id="bgr"><rect width="1024" height="1024" rx="300" fill="url(#bg)"/>
<g clip-path="url(#clip)">
<path class="f" pathLength="100" d="M322 690 V335 H537 M322 499 H487" fill="none" stroke="#fff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
<path class="c" pathLength="100" d="M728 407 A152 152 0 1 0 728 617" fill="none" stroke="#3ec8f3" stroke-width="70" stroke-linecap="round"/>
<path class="l1" d="M221 613 H271" fill="none" stroke="#3ec8f3" stroke-width="38" stroke-linecap="round"/>
<path class="l2" d="M221 702 H309" fill="none" stroke="#3ec8f3" stroke-width="38" stroke-linecap="round"/>
<rect id="shine" x="0" y="-100" width="260" height="1250" fill="url(#sh)"/>
</g></g></svg>
