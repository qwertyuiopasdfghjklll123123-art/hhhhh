<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>__SITE_NAME__</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4f0;--card:#ffffff;--card-border:rgba(34,26,18,.08);--text:#221a12;--muted:#6b5d50;--text3:#998a7c;--primary:#2563eb;--primary-light:#3b82f6;--primary-glow:rgba(37,99,235,.14);--primary-bg:rgba(37,99,235,.08);--input-bg:#fbf7f3;--border:#f0e6da;--shadow:0 2px 10px rgba(34,26,18,.05);--shadow-lg:0 8px 30px rgba(34,26,18,.08);--danger:#ef4444;--warn:#f59e0b;--purple:#7c3aed;--green:#10b981}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}
.topbar{position:sticky;top:0;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;letter-spacing:-.3px}
.topbar .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:0 4px 14px var(--primary-glow)}
.bell{position:relative;width:38px;height:38px;border-radius:12px;background:var(--card);border:1.5px solid var(--card-border);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--primary)}
.dot{position:absolute;top:-3px;left:-3px;width:9px;height:9px;background:var(--danger);border-radius:50%;display:none;border:2px solid var(--bg)}
#content{padding:6px 16px;max-width:560px;margin:0 auto;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-title{font-size:19px;font-weight:900;margin:6px 0 14px;letter-spacing:-.3px}
.back-row{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.back-row .back-btn{width:34px;height:34px;border-radius:11px;background:var(--card);border:1.5px solid var(--card-border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex-shrink:0}
.back-row .page-title{margin:0}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-header h4{margin:0;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--input-bg);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center}
.stat b{font-size:21px;display:block;color:var(--primary);font-weight:900}
.stat span{font-size:11px;color:var(--text3);font-weight:600}
.btn{padding:12px 16px;border:none;border-radius:12px;font-size:13.5px;font-weight:800;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;width:100%;box-shadow:0 4px 16px var(--primary-glow)}
.btn-outline{background:var(--card);border:1.5px solid var(--card-border);color:var(--text)}
.btn-danger{background:rgba(239,68,68,.07);border:1.5px solid rgba(239,68,68,.25);color:var(--danger)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
input,textarea,select{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;font-size:14px;background:var(--input-bg);font-family:inherit;color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}
label{font-size:11.5px;color:var(--text3);font-weight:700;display:block;margin:10px 0 5px}
.row{display:flex;gap:8px;align-items:center}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--card-border)}
.list-row:last-child{border-bottom:none}
.pill{font-size:10.5px;padding:4px 10px;border-radius:20px;font-weight:800;white-space:nowrap}
.pill-green{background:rgba(16,185,129,.12);color:#0a8a63}
.pill-amber{background:rgba(245,158,11,.14);color:#b45309}
.pill-red{background:rgba(239,68,68,.12);color:var(--danger)}
.pill-gray{background:var(--input-bg);color:var(--text3);border:1px solid var(--border)}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:30px 10px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;pointer-events:none}
.bnav-inner{pointer-events:all;height:62px;border-radius:22px;margin:0 14px 16px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;background:var(--card);border:1px solid var(--card-border);box-shadow:0 10px 24px -8px rgba(34,26,18,.25);max-width:528px;margin-inline:auto}
.bottom-nav button{flex:1;background:none;border:none;padding:7px 4px;font-size:10.5px;color:var(--text3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:16px;font-weight:700;font-family:inherit}
.bottom-nav button.active{color:var(--primary);background:var(--primary-bg)}
.bottom-nav .ic{font-size:18px}
.overlay{position:fixed;inset:0;background:rgba(20,15,10,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.open{display:flex}
.sheet{background:var(--card);border-radius:22px 22px 0 0;padding:22px 18px 28px;width:100%;max-width:560px;max-height:85vh;overflow:auto;box-shadow:var(--shadow-lg)}
.sheet h3{margin:0 0 14px;font-size:16px;font-weight:900}
.muted{color:var(--text3)}
.t-sm{font-size:12px}
.qrbox{display:flex;justify-content:center;padding:16px;background:var(--input-bg);border:1px solid var(--border);border-radius:16px;margin:10px 0}
.qrbox img{width:220px;height:220px;border-radius:8px}
a.link{color:var(--primary);text-decoration:none;font-size:12.5px;font-weight:700}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;z-index:100;display:none;box-shadow:var(--shadow-lg);font-weight:600}
.icon-wrap{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.ic-green{background:linear-gradient(135deg,#10b981,#34d399)}.ic-blue{background:linear-gradient(135deg,var(--primary),var(--primary-light))}.ic-purple{background:linear-gradient(135deg,#7c3aed,#a78bfa)}.ic-amber{background:linear-gradient(135deg,#f59e0b,#fbbf24)}.ic-dark{background:#334155}.ic-gold{background:linear-gradient(135deg,#eab308,#fbbf24)}
.settings-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--card-border);cursor:pointer;font-weight:700;font-size:13.5px}
.settings-item:active{opacity:.7}
.settings-item:last-child{border-bottom:none}
.settings-item .meta{margin-right:auto;color:var(--text3);font-size:11.5px;font-weight:700}
.group-label{font-size:11px;color:var(--text3);font-weight:800;margin:18px 4px 8px;letter-spacing:.3px}
.wallet-hero{background:linear-gradient(135deg,var(--primary),#1d4ed8);border-radius:18px;padding:20px;color:#fff;margin-bottom:14px;box-shadow:0 10px 26px -6px rgba(37,99,235,.45)}
.wallet-hero .lbl{font-size:12px;opacity:.85;font-weight:700}
.wallet-hero .amt{font-size:30px;font-weight:900;margin-top:4px;letter-spacing:-.5px}
.pm-tile{display:flex;align-items:center;gap:12px;padding:13px;border:1.5px solid var(--card-border);border-radius:14px;margin-bottom:9px;cursor:pointer;background:var(--input-bg)}
.pm-tile:active{opacity:.75}
.pm-tile .pm-ic{font-size:22px;width:38px;text-align:center}
.pm-tile b{font-size:13.5px}
.pm-tile .sub{font-size:11px;color:var(--text3);font-weight:600}
.tier-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tier-btn{padding:12px 6px;border-radius:12px;border:1.5px solid var(--border);background:var(--input-bg);font-weight:800;font-size:13px;cursor:pointer;text-align:center}
.tier-btn.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.chk-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.lvl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px}
.lvl-ok{background:var(--green)}.lvl-warn{background:var(--warn)}.lvl-bad{background:var(--danger)}.lvl-info{background:#94a3b8}
.sec-check{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--card-border)}
.sec-check:last-child{border-bottom:none}
.sec-check b{font-size:12.5px;display:block}
.sec-check span{font-size:11px;color:var(--text3)}
.audit-row{font-size:11px;color:var(--text3);padding:7px 0;border-bottom:1px dashed var(--card-border);font-family:monospace;direction:ltr;text-align:right}
.img-prev{max-width:100%;border-radius:12px;margin:8px 0;display:block}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--input-bg);border-radius:12px;padding:4px}
.tabs button{flex:1;border:none;background:none;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:800;color:var(--text3);cursor:pointer;font-family:inherit}
.tabs button.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="logo">و</span> __SITE_NAME__</div>
  <button class="bell" onclick="showSection('notifications')">🔔<span class="dot" id="notifDot"></span></button>
</div>
<div id="content"></div>
<div class="bottom-nav"><div class="bnav-inner">
  <button data-s="home" onclick="showSection('home')"><span class="ic">🏠</span>الرئيسية</button>
  <button data-s="accounts" onclick="showSection('accounts')"><span class="ic">📱</span>حسابي</button>
  <button data-s="campaigns" onclick="showSection('campaigns')"><span class="ic">📣</span>الحملات</button>
  <button data-s="settings" onclick="showSection('settings')"><span class="ic">⚙️</span>الإعدادات</button>
</div></div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const IS_ADMIN = __IS_ADMIN__;
const USERNAME = "__USERNAME__";
const COUNTRY_CODES = __COUNTRY_CODES_JSON__;
const DEFAULT_CC = "__DEFAULT_COUNTRY_CODE__";
let accounts = [];
let gen = 0;

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none', 2500); }
function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }
function openSheet(html){ document.getElementById('sheet').innerHTML = html; document.getElementById('overlay').classList.add('open'); }
function sheetOpen(){ return document.getElementById('overlay').classList.contains('open'); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function backRow(title, to){ return `<div class="back-row"><button class="back-btn" onclick="showSection('${to}')">→</button><div class="page-title">${esc(title)}</div></div>`; }

async function api(path, opts={}){
  const res = await fetch(path, {headers: opts.json !== false ? {'Content-Type':'application/json'} : {}, ...opts});
  let data = null; try { data = await res.json(); } catch(e) {}
  // مسارات ترجع مصفوفة مباشرة - دمجها بـ {status, ...data} يحوّل المصفوفة لكائن بمفاتيح رقمية ويكسر .map/.filter
  if (Array.isArray(data)) return data;
  return {status: res.status, ...(data || {})};
}
async function apiForm(path, formData, method='POST'){
  const res = await fetch(path, {method, body: formData});
  let data = {}; try { data = await res.json(); } catch(e) {}
  return {status: res.status, ...data};
}
function readFileAsDataUrl(file){ return new Promise((resolve,reject)=>{ const fr=new FileReader(); fr.onload=()=>resolve(fr.result); fr.onerror=reject; fr.readAsDataURL(file); }); }

/* ---------------------------------------------------------------- التوجيه (روابط مباشرة للأدمن فقط) */
const SECTION_PATH = {
  home:'/app', accounts:'/app/accounts', campaigns:'/app/campaigns', settings:'/app/settings',
  notifications:'/app/notifications', wallet:'/app/wallet', autoreply:'/app/autoreply',
  subscribers:'/app/subscribers', apikeys:'/app/apikeys',
  admin_users:'/app/admin', admin_security:'/app/admin/security',
  admin_payments:'/app/admin/payments', admin_recharge:'/app/admin/recharge', admin_site:'/app/admin/site',
};
const PATH_SECTION = Object.fromEntries(Object.entries(SECTION_PATH).map(([k,v])=>[v,k]));
const renderers = {
  home: renderHome, accounts: renderAccounts, campaigns: renderCampaigns, settings: renderSettings,
  notifications: renderNotifications, wallet: renderWallet, autoreply: renderAutoReply,
  subscribers: renderSubscribers, apikeys: renderApiKeys,
  admin_users: renderAdminUsers, admin_security: renderAdminSecurity,
  admin_payments: renderAdminPayments, admin_recharge: renderAdminRecharge, admin_site: renderAdminSiteSettings,
};

function showSection(name, opts={}){
  if (!renderers[name]) name = 'home';
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.toggle('active', b.dataset.s === name));
  const myGen = ++gen;
  // المستخدم العادي يبقى دائماً على /app بدون تغيير الرابط؛ الأدمن وحده يحصل على رابط مباشر لكل قسم
  if (IS_ADMIN && !opts.noHistory) {
    const path = SECTION_PATH[name] || '/app';
    if (location.pathname !== path) history.pushState({section:name}, '', path);
  }
  renderers[name](myGen);
}
window.addEventListener('popstate', (e) => {
  const name = (e.state && e.state.section) || PATH_SECTION[location.pathname] || 'home';
  showSection(name, {noHistory:true});
});

/* ---------------------------------------------------------------- الرئيسية */
async function renderHome(myGen){
  document.getElementById('content').innerHTML = '<div class="page-title">الرئيسية</div><div class="card"><div class="empty">...</div></div>';
  const [s, w] = await Promise.all([api('/dashboard/stats'), api('/wallet/balance')]);
  if (myGen !== gen) return;
  document.getElementById('content').innerHTML = `
    <div class="page-title">أهلاً، ${esc(USERNAME)} 👋</div>
    ${w.metering_enabled ? `<div class="card" style="cursor:pointer" onclick="showSection('wallet')">
      <div class="row" style="justify-content:space-between">
        <span class="t-sm">💰 رصيد محفظتك</span><b style="color:var(--primary)">${(w.balance_iqd||0).toLocaleString()} د.ع</b>
      </div></div>` : ''}
    <div class="card">
      <div class="stat-grid">
        <div class="stat"><b>${s.accounts_connected||0}/${s.accounts_total||0}</b><span>حسابات متصلة</span></div>
        <div class="stat"><b>${s.messages_sent||0}</b><span>رسالة مُرسَلة</span></div>
        <div class="stat"><b>${s.success_rate||0}%</b><span>نسبة النجاح</span></div>
        <div class="stat"><b>${s.campaigns_total||0}</b><span>حملة سابقة</span></div>
      </div>
    </div>
    <div class="card"><div class="card-header"><h4>حملات جارية</h4></div><div id="runningBox"><div class="empty">...</div></div></div>
    <div class="card"><div class="card-header"><h4>آخر الحملات</h4></div><div id="histBox"><div class="empty">...</div></div></div>`;
  loadRunning(myGen);
  const hist = await api('/dashboard/campaigns');
  if (myGen !== gen) return;
  document.getElementById('histBox').innerHTML = hist.length ? hist.map(h => `
    <div class="list-row"><span class="t-sm">${esc(h.account_name)} · ${esc(h.time)}</span>
    <span class="pill ${h.failed>0?'pill-amber':'pill-green'}">${h.sent}/${h.total}</span></div>`).join('') : '<div class="empty">ما فيه حملات بعد</div>';
}
async function loadRunning(myGen){
  const rows = await api('/dashboard/running_campaigns');
  const box = document.getElementById('runningBox');
  if (myGen !== gen || !box) return; // تغيّر القسم أو انتقلنا لصفحة ثانية (تسجيل خروج) وهذا الطلب لسا معلّق
  box.innerHTML = rows.length ? rows.map(r => runningCampaignHtml(r.account_id, r, r.account_name)).join('') : '<div class="empty">ما فيه حملة جارية حالياً</div>';
}

/* ---------------------------------------------------------------- الحسابات */
async function renderAccounts(myGen){
  document.getElementById('content').innerHTML = '<div class="page-title">حساباتي</div><div class="card"><div class="empty">...</div></div>';
  accounts = await api('/accounts');
  if (myGen !== gen) return;
  document.getElementById('content').innerHTML = `
    <div class="page-title">حساباتي</div>
    <div class="card"><div id="accList"></div>
      <button class="btn btn-primary" style="margin-top:10px" onclick="addAccount()">+ إضافة حساب واتساب</button>
    </div>`;
  renderAccList();
  pollAccounts(myGen);
}
function renderAccList(){
  const box = document.getElementById('accList');
  if (!box) return;
  box.innerHTML = accounts.length ? accounts.map(a => `
    <div class="list-row">
      <span>${esc(a.name)} ${a.otp_sender ? '<span class="pill pill-gray">مرسل الأكواد</span>' : ''}</span>
      <span class="row" style="width:auto">
        <span class="pill ${a.logged_in?'pill-green':'pill-amber'}">${a.logged_in?'متصل':(a.status==='qr'?'مسح الباركود':'غير متصل')}</span>
        ${!a.logged_in ? `<button class="btn btn-sm btn-outline" onclick="showQr('${a.id}')">ربط</button>` : ''}
        <button class="btn btn-sm btn-danger" onclick="deleteAccount('${a.id}')">حذف</button>
      </span>
    </div>`).join('') : '<div class="empty">ما عندك حساب واتساب بعد</div>';
}
async function pollAccounts(myGen){
  if (myGen !== gen) return;
  accounts = await api('/accounts');
  if (myGen !== gen) return;
  renderAccList();
  setTimeout(() => pollAccounts(myGen), 4000);
}
async function addAccount(){
  const r = await api('/accounts', {method:'POST', body: JSON.stringify({name:''})});
  if (!r.ok && r.status >= 400) { toast(r.error||'فشل'); return; }
  accounts = await api('/accounts');
  renderAccList();
  showQr(r.id);
}
function showQr(accId){
  openSheet(`<h3>اربط حساب واتساب</h3><p class="t-sm muted">افتح واتساب بجوالك ← الأجهزة المرتبطة ← ربط جهاز، وامسح الرمز:</p>
    <div class="qrbox"><img id="qrImg" src="/accounts/${accId}/qr?t=${Date.now()}" onerror="this.style.display='none'"></div>
    <p class="t-sm muted" style="text-align:center">إذا ما ظهر الرمز، انتظر ثواني وأعد فتح هذه النافذة</p>
    <button class="btn btn-outline" style="width:100%" onclick="closeSheet()">إغلاق</button>`);
  let tries = 0;
  const iv = setInterval(() => {
    if (!document.getElementById('overlay').classList.contains('open') || ++tries > 60) { clearInterval(iv); return; }
    const img = document.getElementById('qrImg');
    if (img) { img.style.display=''; img.src = `/accounts/${accId}/qr?t=${Date.now()}`; }
  }, 2500);
}
async function deleteAccount(accId){
  if (!confirm('حذف هذا الحساب نهائياً؟')) return;
  await api(`/accounts/${accId}/logout`, {method:'POST'});
  accounts = await api('/accounts');
  renderAccList();
}

/* ---------------------------------------------------------------- الحملات */
function connectedAccounts(){ return accounts.filter(a => a.logged_in); }
async function renderCampaigns(myGen){
  accounts = await api('/accounts');
  if (myGen !== gen) return;
  const conn = connectedAccounts();
  document.getElementById('content').innerHTML = `
    <div class="page-title">الحملات</div>
    ${conn.length ? `
    <div class="card">
      <div class="card-header"><h4>حملة جديدة</h4></div>
      <label>الحساب المُرسِل</label>
      <select id="cAcc">${conn.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>
      <label>الأرقام (رقم بكل سطر أو مفصولة بفاصلة)</label>
      <textarea id="cNumbers" rows="4" placeholder="07701234567"></textarea>
      <label>رمز الدولة الافتراضي للأرقام المحلية</label>
      <select id="cCc">${COUNTRY_CODES.map(c=>`<option value="${c[0]}" ${c[0]===DEFAULT_CC?'selected':''}>${esc(c[1])}</option>`).join('')}</select>
      <label>نص الرسالة</label>
      <textarea id="cText" rows="3" placeholder="هلوو"></textarea>
      <label>الفاصل بين كل رسالة (ثانية)</label>
      <input id="cDelay" type="number" value="15" min="1">
      <button class="btn btn-primary" style="margin-top:12px" onclick="startCampaign()">بدء الحملة</button>
    </div>` : `<div class="card"><div class="empty">وصّل حساب واتساب أول من قسم "حسابي" حتى تقدر تبدأ حملة</div></div>`}
    <div class="card"><div class="card-header"><h4>حملات جارية</h4></div><div id="cRunning"><div class="empty">...</div></div></div>`;
  loadRunning(myGen);

        ${c.plan_ends_at ? `<span class="t-sm muted">نهاية الاشتراك: ${esc(c.plan_ends_at)}</span>` : ''}
        <div class="row">
          <button class="btn btn-sm btn-primary" onclick="setPlan(${c.id},true)">تفعيل 30 يوم</button>
          <button class="btn btn-sm btn-outline" onclick="setPlan(${c.id},false)">إيقاف</button>
        </div>
      </div>`).join('')}</div>`;
}
async function setPlan(uid, active){ await api(`/admin/customers/${uid}/plan`, {method:'POST', body: JSON.stringify({active, days:30})}); toast('تم التحديث'); renderAdminUsers(gen); }

/* ---------------------------------------------------------------- لوحة الأدمن: طلبات الشحن */
async function renderAdminRecharge(myGen){
  document.getElementById('content').innerHTML = backRow('طلبات الشحن', 'settings') + '<div class="card"><div class="empty">...</div></div>';
  const d = await api('/admin/recharge-requests');
  if (myGen !== gen) return;
  const reqs = d.requests || [];
  document.getElementById('content').innerHTML = backRow('طلبات الشحن', 'settings') +
    `<div class="row" style="margin-bottom:10px"><span class="pill pill-amber">معلّقة ${d.pending||0}</span><span class="pill pill-green">مقبولة ${d.approved||0}</span><span class="pill pill-red">مرفوضة ${d.rejected||0}</span></div>
    <div class="card">${reqs.length ? reqs.map(r => `
      <div class="list-row" style="flex-direction:column;align-items:stretch;gap:6px" id="rr-${r.id}">
        <div class="row" style="justify-content:space-between">
          <span class="t-sm"><b>${esc(r.user_name||r.user_email||('#'+r.user_id))}</b> · ${esc(r.method)}</span>
          <span class="pill ${r.status==='pending'?'pill-amber':(r.status==='approved'?'pill-green':'pill-red')}">${r.status==='pending'?'معلّق':(r.status==='approved'?'مقبول':'مرفوض')}</span>
        </div>
        <span class="t-sm muted">${(r.amount_iqd||0).toLocaleString()} د.ع · ${esc(r.created_at)} ${r.auto?'· تلقائي':''}</span>
        <div class="row">
          ${r.has_receipt ? `<button class="btn btn-sm btn-outline" onclick="toggleReceipt(${r.id})">عرض الإثبات</button>` : ''}
          ${r.status==='pending' ? `<button class="btn btn-sm btn-primary" onclick="rechargeAction(${r.id},'approve')">قبول</button>
            <button class="btn btn-sm btn-danger" onclick="rechargeAction(${r.id},'reject')">رفض</button>` : ''}
        </div>
        <div id="rrc-${r.id}"></div>
      </div>`).join('') : '<div class="empty">ما فيه طلبات شحن</div>'}</div>`;
}
async function toggleReceipt(id){
  const box = document.getElementById(`rrc-${id}`);
  if (box.innerHTML) { box.innerHTML = ''; return; }
  const r = await api(`/admin/recharge-requests/${id}/receipt`);
  if (!r.ok) { toast('تعذر جلب الإثبات'); return; }
  box.innerHTML = r.receipt.startsWith('data:image') ? `<img class="img-prev" src="${r.receipt}">` : `<p class="t-sm" style="word-break:break-all">${esc(r.receipt)}</p>`;
}
async function rechargeAction(id, action){
  const r = await api(`/admin/recharge-requests/${id}/action`, {method:'POST', body: JSON.stringify({action})});
  if (!r.ok) { toast(r.msg); return; }
  toast(r.msg); renderAdminRecharge(gen);
}

/* ---------------------------------------------------------------- لوحة الأدمن: طرق الدفع */
async function renderAdminPayments(myGen){
  document.getElementById('content').innerHTML = backRow('طرق الدفع', 'settings') + '<div class="card"><div class="empty">...</div></div>';
  const d = await api('/admin/payment-methods');
  if (myGen !== gen) return;
  const methods = d.methods || [];
  const binance = methods.find(m => m.method_type === 'binance');
  const asiacell = methods.find(m => m.method_type === 'asiacell');
  const manual = methods.filter(m => m.method_type === 'manual');
  document.getElementById('content').innerHTML = backRow('طرق الدفع', 'settings') + `
    <div class="card"><div class="card-header"><h4>🟡 Binance Pay</h4><label class="row" style="width:auto;margin:0"><input type="checkbox" id="binActive" ${binance&&binance.active?'checked':''} style="width:auto">مفعّلة</label></div>
      <label>Binance ID (المعرّف الذي يستقبل الدفعات)</label><input id="binId" value="${esc(binance?binance.number:'')}">
      <label>API Key ${binance&&binance.has_binance_keys?'<span class="pill pill-green">محفوظ</span>':''}</label><input id="binKey" placeholder="اتركه فارغاً للاحتفاظ بالحالي">
      <label>API Secret</label><input id="binSecret" type="password" placeholder="اتركه فارغاً للاحتفاظ بالحالي">
      <label>صورة QR (اختياري)</label><input id="binQr" type="file" accept="image/*">
      <button class="btn btn-primary" style="margin-top:12px" onclick="saveBinance()">حفظ إعدادات Binance</button>
    </div>
    <div class="card"><div class="card-header"><h4>📶 آسياسيل</h4><label class="row" style="width:auto;margin:0"><input type="checkbox" id="asiaActive" ${asiacell&&asiacell.active?'checked':''} style="width:auto">مفعّلة</label></div>
      <label>رقم آسياسيل المستقبل (07xxxxxxxxx)</label><input id="asiaNumber" value="${esc(asiacell?asiacell.number:'')}">
      <label>نسبة الخصم (كم دينار رصيد هاتف = 1 دينار محفظة، مثال 1 = بلا خصم، 1.15 = خصم 15%)</label><input id="asiaRate" type="number" step="0.01" value="${asiacell&&asiacell.exchange_rate?asiacell.exchange_rate:1}">
      <label>أعلى مبلغ بالتحويلة الواحدة (د.ع)</label><input id="asiaMax" type="number" value="${asiacell&&asiacell.max_transfer?asiacell.max_transfer:10000}">
      <label>ملاحظة تظهر للمستخدم</label><textarea id="asiaNote" rows="2">${esc(asiacell?asiacell.note:'')}</textarea>
      <div class="group-label" style="margin-top:14px">الشرائح (هدية اختيارية لكل مبلغ)</div>
      <div id="asiaTiers">${(asiacell&&asiacell.tiers?asiacell.tiers:[]).map(t => `
        <div class="row" style="margin:6px 0" data-tier="${t.iqd}"><span class="t-sm" style="width:90px">${Number(t.iqd).toLocaleString()} د.ع</span><input type="number" class="tier-bonus" value="${t.bonus||0}" placeholder="هدية"></div>`).join('')}</div>
      <button class="btn btn-primary" style="margin-top:12px" onclick="saveAsiacell()">حفظ إعدادات آسياسيل</button>
    </div>
    <div class="card"><div class="card-header"><h4>💳 طرق يدوية أخرى</h4></div>
      <div id="manualList">${manual.map(m => manualPmRow(m)).join('')}</div>
      <button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="showAddManualPm('Super Key')">➕ أضف Super Key</button>
      <button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="showAddManualPm('')">➕ أضف طريقة يدوية أخرى</button>
      <div id="addPmBox"></div>
    </div>`;
}
function manualPmRow(m){
  return `<div class="list-row"><span class="t-sm">${esc(m.name)} ${m.active?'':'<span class="pill pill-gray">معطّلة</span>'}<br><span class="muted">${esc(m.number||'')}</span></span>
    <span class="row" style="width:auto"><button class="btn btn-sm btn-outline" onclick="toggleManualPm(${m.id},${m.active?'false':'true'})">${m.active?'تعطيل':'تفعيل'}</button>
    <button class="btn btn-sm btn-danger" onclick="deleteManualPm(${m.id})">حذف</button></span></div>`;
}
function showAddManualPm(prefillName){
  document.getElementById('addPmBox').innerHTML = `
    <div class="group-label">طريقة يدوية جديدة</div>
    <label>الاسم</label><input id="npmName" value="${esc(prefillName)}">
    <label>الرقم/الحساب المستقبل</label><input id="npmNumber">
    <label>العملة</label><input id="npmCurrency" value="IQD">
    <label>ملاحظة تظهر للمستخدم</label><textarea id="npmNote" rows="2" placeholder="مثال: اشتر بطاقة Super Key بالمبلغ المطلوب وأرسل الكود هنا"></textarea>
    <label>شعار (اختياري)</label><input id="npmImage" type="file" accept="image/*">
    <button class="btn btn-primary" style="margin-top:10px" onclick="addManualPm()">إضافة</button>`;
}
async function addManualPm(){
  const name = document.getElementById('npmName').value.trim();
  if (!name) { toast('اكتب اسم الطريقة'); return; }
  const file = document.getElementById('npmImage').files[0];
  const body = {name, number: document.getElementById('npmNumber').value.trim(), currency: document.getElementById('npmCurrency').value.trim()||'IQD', note: document.getElementById('npmNote').value.trim()};
  if (file) body.image_data = await readFileAsDataUrl(file);
  const r = await api('/admin/payment-methods', {method:'POST', body: JSON.stringify(body)});
  if (!r.ok) { toast(r.msg); return; }
  toast(r.msg); renderAdminPayments(gen);
}
async function toggleManualPm(id, active){
  await api(`/admin/payment-methods/${id}`, {method:'PUT', body: JSON.stringify({active: active==='true'||active===true})});
  renderAdminPayments(gen);
}
async function deleteManualPm(id){
  if (!confirm('حذف طريقة الدفع هذه؟')) return;
  await api(`/admin/payment-methods/${id}`, {method:'DELETE'});
  renderAdminPayments(gen);
}
async function saveBinance(){
  const file = document.getElementById('binQr').files[0];
  const body = {active: document.getElementById('binActive').checked, binance_id: document.getElementById('binId').value.trim(),
    api_key: document.getElementById('binKey').value.trim(), api_secret: document.getElementById('binSecret').value.trim()};
  if (file) body.qr_data = await readFileAsDataUrl(file);
  const r = await api('/admin/payment-methods/binance', {method:'POST', body: JSON.stringify(body)});
  if (!r.ok) { toast(r.msg); return; }
  toast(r.msg); renderAdminPayments(gen);
}
async function saveAsiacell(){
  const tiers = [...document.querySelectorAll('#asiaTiers [data-tier]')].map(row => ({iqd: parseInt(row.dataset.tier), bonus: parseFloat(row.querySelector('.tier-bonus').value||'0')}));
  const body = {active: document.getElementById('asiaActive').checked, receiver_msisdn: document.getElementById('asiaNumber').value.trim(),
    exchange_rate: parseFloat(document.getElementById('asiaRate').value||'1'), max_transfer: parseInt(document.getElementById('asiaMax').value||'10000'),
    note: document.getElementById('asiaNote').value.trim(), tiers};
  const r = await api('/admin/payment-methods/asiacell', {method:'POST', body: JSON.stringify(body)});
  if (!r.ok) { toast(r.msg); return; }
  toast(r.msg); renderAdminPayments(gen);
}

/* ---------------------------------------------------------------- لوحة الأدمن: الأمان */
async function renderAdminSecurity(myGen){
  document.getElementById('content').innerHTML = backRow('الأمان', 'settings') + '<div class="card"><div class="empty">...</div></div>';
  const d = await api('/admin/security/status');
  if (myGen !== gen) return;
  const lvlPill = {bad:'pill-red', warn:'pill-amber', ok:'pill-green', info:'pill-gray'};
  document.getElementById('content').innerHTML = backRow('الأمان', 'settings') + `
    <div class="row" style="margin-bottom:10px">
      <span class="pill pill-red">خطر ${d.counts.bad||0}</span><span class="pill pill-amber">تنبيه ${d.counts.warn||0}</span>
      <span class="pill pill-green">سليم ${d.counts.ok||0}</span><span class="pill pill-gray">معلومة ${d.counts.info||0}</span>
    </div>
    <div class="card">${(d.checks||[]).map(c => `
      <div class="sec-check"><span class="lvl-dot lvl-${c.level}"></span><div><b>${esc(c.title)}</b>${c.detail?`<span>${esc(c.detail)}</span>`:''}</div></div>`).join('')}</div>
    <div class="card"><div class="card-header"><h4>إلغاء كل الجلسات</h4></div>
      <p class="t-sm muted">يُخرج جميع المستخدمين (بما فيك) فوراً - استخدمها عند الشك بأن جلسة تسربت.</p>
      <label>كلمة مرورك للتأكيد</label><input id="revokePw" type="password">
      <button class="btn btn-danger" style="width:100%;margin-top:8px" onclick="revokeSessions()">إلغاء كل الجلسات الآن</button>
    </div>
    <div class="card"><div class="card-header"><h4>سجل تدقيق عمليات الأدمن (آخر ${(d.audit||[]).length})</h4></div>
      <div style="max-height:260px;overflow:auto">${(d.audit||[]).length ? d.audit.slice().reverse().map(a => `<div class="audit-row">${esc(JSON.stringify(a))}</div>`).join('') : '<div class="empty">لا يوجد سجل بعد</div>'}</div>
    </div>`;
}
async function revokeSessions(){
  if (!confirm('هذا يخرجك أنت أيضاً وتحتاج تسجيل الدخول من جديد. متأكد؟')) return;
  const password = document.getElementById('revokePw').value;
  const r = await api('/admin/security/revoke-sessions', {method:'POST', body: JSON.stringify({password})});
  if (!r.ok) { toast(r.msg); return; }
  toast(r.msg);
  setTimeout(() => window.location.href = '/', 800);
}

/* ---------------------------------------------------------------- لوحة الأدمن: إعدادات الموقع */

    <div class="card">
      <label>اسم الموقع</label><input id="ssName" value="${esc(s.site_name||'')}">
      <label>رمز الدولة الافتراضي للأرقام المحلية</label>
      <select id="ssCc">${COUNTRY_CODES.map(c=>`<option value="${c[0]}" ${c[0]===s.default_country_code?'selected':''}>${esc(c[1])}</option>`).join('')}</select>
      <label>رقم واتساب الاشتراكات</label><input id="ssSubNum" value="${esc(s.whatsapp_subscribe_number||'')}">

      <label>سعر الرسالة الواحدة (د.ع) - صفر = الإرسال مجاني بلا خصم محفظة</label><input id="ssMsgPrice" type="number" min="0" value="${s.price_per_message_iqd||0}">
      <label>سعر صرف الدولار بالدينار (لشحن Binance)</label><input id="ssUsdRate" type="number" min="1" value="${s.usd_to_iqd_rate||1310}">
      <button class="btn btn-primary" style="margin-top:12px" onclick="saveSiteSettings()">حفظ كل الإعدادات</button>
    </div>`;
}
async function saveSiteSettings(){
  const body = {
    site_name: document.getElementById('ssName').value.trim(), default_country_code: document.getElementById('ssCc').value,
    whatsapp_subscribe_number: document.getElementById('ssSubNum').value.trim(), whatsapp_support_number: document.getElementById('ssSupNum').value.trim(),
    plan_price_iqd: parseInt(document.getElementById('ssPlanPrice').value||'0'),
    price_per_message_iqd: parseInt(document.getElementById('ssMsgPrice').value||'0'),
    usd_to_iqd_rate: parseInt(document.getElementById('ssUsdRate').value||'1310'),
  };
  const r = await api('/admin/site_settings', {method:'POST', body: JSON.stringify(body)});
  if (r.ok) toast('تم الحفظ'); else toast('فشل الحفظ');
}

/* ---------------------------------------------------------------- الإشعارات */
async function renderNotifications(myGen){
  document.getElementById('content').innerHTML = '<div class="page-title">الإشعارات</div><div class="card"><div class="empty">...</div></div>';
  const rows = await api('/events?since=0');
  if (myGen !== gen) return;
  document.getElementById('content').innerHTML = `<div class="page-title">الإشعارات</div>
    ${rows.length ? `<button class="btn btn-outline" style="margin-bottom:10px" onclick="markAllRead()">تحديد الكل كمقروء</button>` : ''}
    <div class="card">${rows.length ? rows.slice().reverse().map(e => `
      <div class="list-row" style="opacity:${e.read?0.6:1}"><span class="t-sm"><b>${esc(e.title)}</b><br><span class="muted">${esc(e.body)} · ${esc(e.time)}</span></span>
      <button class="btn btn-sm btn-outline" onclick="delNotif(${e.id})">حذف</button></div>`).join('') : '<div class="empty">ما فيه إشعارات</div>'}</div>`;
  document.getElementById('notifDot').style.display = rows.some(e=>!e.read) ? 'block' : 'none';
}
async function markAllRead(){ await api('/events/read_all', {method:'POST'}); showSection('notifications'); }
async function delNotif(id){ await api(`/events/${id}`, {method:'DELETE'}); showSection('notifications'); }

async function pollNotifDot(){
  try {
    const rows = await api('/events?since=0');
    const dot = document.getElementById('notifDot');
    if (dot) dot.style.display = Array.isArray(rows) && rows.some(e=>!e.read) ? 'block' : 'none';
  } catch(e){}
  if (document.getElementById('notifDot')) setTimeout(pollNotifDot, 15000); // يتوقف من نفسه لو انتقلنا لصفحة ثانية (تسجيل خروج)
}

/* بداية التشغيل: المستخدم العادي يبقى دائماً على /app بصرف النظر عن الرابط الحالي؛
   الأدمن يفتح على القسم الذي يطابق الرابط الحالي (دعم الروابط المباشرة والتحديث) */
if (!IS_ADMIN && location.pathname !== '/app') history.replaceState(null, '', '/app');
showSection(IS_ADMIN ? (PATH_SECTION[location.pathname] || 'home') : 'home', {noHistory:true});
pollNotifDot();
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('/sw.js'); } catch(e){} }
</script>
