<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>__SITE_NAME__</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4f0;--card:#ffffff;--card-border:rgba(34,26,18,.08);--primary:#2563eb;--primary-light:#3b82f6;--primary-glow:rgba(37,99,235,.14);--text:#221a12;--muted:#6b5d50;--border:#f0e6da;--danger:#ef4444;--input-bg:#fbf7f3}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transform:translateY(10px);animation:pageIn .5s cubic-bezier(.22,.9,.3,1) forwards}
body.leaving{animation:pageOut .22s ease forwards}
@keyframes pageIn{to{opacity:1;transform:translateY(0)}}
@keyframes pageOut{to{opacity:0;transform:translateY(-10px) scale(.98)}}
.step{transition:opacity .22s ease, transform .22s ease}
.step-out{opacity:0;transform:translateY(8px)}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:22px;box-shadow:0 8px 30px rgba(34,26,18,.08);padding:30px 24px;width:100%;max-width:380px}
.logo{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;margin:0 auto 16px;box-shadow:0 6px 18px var(--primary-glow)}
h1{font-size:21px;font-weight:900;text-align:center;margin:0 0 4px;letter-spacing:-.3px}
p.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px;font-weight:600}
label{font-size:11.5px;color:var(--muted);font-weight:700;display:block;margin:14px 0 6px}
input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:13px;font-size:15px;background:var(--input-bg);outline:none;font-family:inherit;color:var(--text)}
input:focus{border-color:var(--primary)}
.row{display:flex;gap:8px}
.row select{flex:0 0 92px;padding:13px 6px;border:1.5px solid var(--border);border-radius:13px;background:var(--input-bg);font-size:14px;font-family:inherit}
button.main{width:100%;margin-top:18px;padding:14px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px var(--primary-glow);transition:transform .15s}
button.main:disabled{opacity:.6;cursor:default;transform:none}
button.main:active{transform:scale(.98)}
.err{color:var(--danger);font-size:12.5px;text-align:center;min-height:18px;margin-top:10px;font-weight:600}
.divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--muted);font-size:12px;font-weight:600}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.mini{text-align:center;margin-top:16px;font-size:11.5px}
.mini a{color:var(--muted);text-decoration:none;font-weight:600}
.back{background:none;border:none;color:var(--primary);font-size:13px;font-weight:700;cursor:pointer;margin-bottom:6px;padding:0}
.emailBtn{display:block;width:100%;margin-top:14px;padding:13px;border:1.5px solid var(--border);border-radius:13px;background:var(--input-bg);color:var(--text);font-size:14px;font-weight:700;text-align:center;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">و</div>
  <h1>__SITE_NAME__</h1>
  <p class="sub">حملات واتساب للأعمال</p>

  <div id="step-phone" class="step">
    <label>رقم واتساب</label>
    <div class="row">
      <select id="cc">__COUNTRY_CODE_OPTIONS__</select>
      <input id="phone" type="tel" placeholder="7701234567" inputmode="numeric">
    </div>
    <button class="main" id="btnSend" onclick="sendCode()">إرسال رمز التحقق</button>
    <div class="err" id="errPhone"></div>
    <div class="divider" id="googleDivider" style="display:none">أو</div>
    <div id="gsi"></div>
    <a href="/login/email" class="emailBtn">دخول بالبريد الإلكتروني</a>
  </div>

  <div id="step-code" class="step" style="display:none">
    <button class="back" onclick="backToPhone()">‹ رجوع</button>
    <label>رمز التحقق المرسل لواتسابك</label>
    <input id="code" type="tel" placeholder="123456" inputmode="numeric" maxlength="6">
    <button class="main" id="btnVerify" onclick="verifyCode()">تأكيد</button>
    <div class="err" id="errCode"></div>
  </div>
</div>

<script>
const GOOGLE_CLIENT_ID = "__GOOGLE_CLIENT_ID__";
let fullPhone = "";

/* انتقال ناعم (تلاشي + انزلاق بسيط) بين خطوتي تسجيل الدخول بدل قطع display مباشر */
function switchStep(hideEl, showEl){
  hideEl.classList.add('step-out');
  setTimeout(() => {
    hideEl.style.display = 'none';
    showEl.style.display = 'block';
    showEl.classList.add('step-out');
    requestAnimationFrame(() => requestAnimationFrame(() => showEl.classList.remove('step-out')));
  }, 220);
}
/* انتقال ناعم عند مغادرة صفحة الدخول للتطبيق بدل قفزة فورية */
function leaveToApp(){ document.body.classList.add('leaving'); setTimeout(() => window.location.href = '/app', 200); }

function backToPhone(){ switchStep(document.getElementById('step-code'), document.getElementById('step-phone')); }

async function sendCode(){
  const cc = document.getElementById('cc').value;
  const local = document.getElementById('phone').value.replace(/\D/g,'');
  if (local.length < 6) { document.getElementById('errPhone').textContent = 'أدخل رقم صحيح'; return; }
  fullPhone = cc + (local.startsWith('0') ? local.slice(1) : local);
  const btn = document.getElementById('btnSend'); btn.disabled = true; btn.textContent = 'جاري الإرسال...';
  try {
    const res = await fetch('/auth/whatsapp/send_code', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({phone: fullPhone})});
    const data = await res.json();
    if (!data.ok) { document.getElementById('errPhone').textContent = data.error || 'تعذر الإرسال'; btn.disabled=false; btn.textContent='إرسال رمز التحقق'; return; }
    if (data.master) { leaveToApp(); return; }
    switchStep(document.getElementById('step-phone'), document.getElementById('step-code'));
    btn.disabled=false; btn.textContent='إرسال رمز التحقق';
  } catch(e) { document.getElementById('errPhone').textContent = 'تعذر الاتصال بالخادم'; btn.disabled=false; btn.textContent='إرسال رمز التحقق'; }
}

async function verifyCode(){
  const code = document.getElementById('code').value.trim();
  if (code.length < 4) { document.getElementById('errCode').textContent = 'أدخل الرمز'; return; }
  const btn = document.getElementById('btnVerify'); btn.disabled = true; btn.textContent = 'جاري التحقق...';
  try {
    const res = await fetch('/auth/whatsapp/verify', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({phone: fullPhone, code})});
    const data = await res.json();
    if (!data.ok) { document.getElementById('errCode').textContent = data.error || 'الرمز غير صحيح'; btn.disabled=false; btn.textContent='تأكيد'; return; }
    leaveToApp();
  } catch(e) { document.getElementById('errCode').textContent = 'تعذر الاتصال بالخادم'; btn.disabled=false; btn.textContent='تأكيد'; }
}

async function onGoogleCredential(resp){
  try {
    const res = await fetch('/api/google-login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({credential: resp.credential})});
    const data = await res.json();
    if (data.ok) { leaveToApp(); } else { document.getElementById('errPhone').textContent = data.error || 'تعذر الدخول بجوجل'; }
  } catch(e) { document.getElementById('errPhone').textContent = 'تعذر الاتصال بالخادم'; }
}

if (GOOGLE_CLIENT_ID) {
  document.getElementById('googleDivider').style.display = '';
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true; s.defer = true;
  s.onload = function(){
    if (window.google && google.accounts) {
      google.accounts.id.initialize({client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential});
      google.accounts.id.renderButton(document.getElementById('gsi'), {theme:'outline', size:'large', width: 320, locale:'ar'});
    }
  };
  document.head.appendChild(s);
}
</script>
</body>
</html>
